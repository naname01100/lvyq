<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惹~~~</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        img {
            position: absolute;
            width: 100px; /* 初始大小 */
            height: auto;
            cursor: pointer;
            transition: transform 3s ease-out, opacity 2s ease-in;
        }
    </style>
</head>
<body>

    <script>
        let imageCount = 3; // 初始图片数量
        const images = [];
        const imgSrc1 = "Koukou.jpg"; // 初始图片
        const imgSrc2 = "Koukou2.jpg"; // 点击后变成的图片

        function createImage(x, y) {
            let img = document.createElement("img");
            img.src = imgSrc1;
            img.style.left = x + "px";
            img.style.top = y + "px";

            let speedX = (Math.random() * 4 + 1) * (Math.random() > 0.5 ? 1 : -1);
            let speedY = (Math.random() * 4 + 1) * (Math.random() > 0.5 ? 1 : -1);

            img.addEventListener("click", function () {
                img.src = imgSrc2;
                img.style.transform = "scale(3)"; // 3秒内变大3倍

                setTimeout(() => {
                    img.style.opacity = "0"; // 渐隐
                    setTimeout(() => {
                        img.remove(); // 彻底消失
                        doubleImages(); // 触发图片翻倍
                    }, 2000); // 2秒后消失
                }, 3000); // 3秒后开始渐隐
            });

            document.body.appendChild(img);
            images.push({ img, speedX, speedY });
        }

        function doubleImages() {
            let currentCount = images.length;
            for (let i = 0; i < currentCount; i++) {
                let x = Math.random() * window.innerWidth;
                let y = Math.random() * window.innerHeight;
                createImage(x, y);
            }
        }

        function move() {
            images.forEach(obj => {
                let maxX = window.innerWidth - obj.img.clientWidth;
                let maxY = window.innerHeight - obj.img.clientHeight;

                let x = parseFloat(obj.img.style.left);
                let y = parseFloat(obj.img.style.top);

                x += obj.speedX;
                y += obj.speedY;

                if (x <= 0 || x >= maxX) obj.speedX *= -1;
                if (y <= 0 || y >= maxY) obj.speedY *= -1;

                obj.img.style.left = x + "px";
                obj.img.style.top = y + "px";
            });

            requestAnimationFrame(move);
        }

        // 初始化3张图片
        for (let i = 0; i < imageCount; i++) {
            let x = Math.random() * window.innerWidth;
            let y = Math.random() * window.innerHeight;
            createImage(x, y);
        }

        move();
    </script>
</body>
</html>
